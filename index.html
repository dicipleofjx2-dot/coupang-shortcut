<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿠팡 바로가기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e52528">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쿠팡">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:'Malgun Gothic',sans-serif;background:#fff;color:#222;text-align:center;padding:16px}
  button{border:0;background:none;cursor:pointer;padding:0}
  img{width:200px;height:200px;border-radius:24px}
  p{margin:0;font-size:15px;color:#555}
  #guide{display:none;background:#f5f5f5;border-radius:12px;padding:12px 16px;font-size:14px;max-width:300px}
</style>
</head>
<body>
  <button id="install" aria-label="홈 화면에 쿠팡 아이콘 설치"><img src="icon-512.png" alt="쿠팡 쇼핑백"></button>
  <p>아이콘을 누르면 홈 화면에 설치됩니다</p>
  <div id="guide"></div>
  <script>
    let deferred;
    const guide = document.getElementById('guide');
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
    document.getElementById('install').addEventListener('click', async () => {
      if (deferred) {
        deferred.prompt();
        await deferred.userChoice;
        deferred = null;
        return;
      }
      const ua = navigator.userAgent;
      guide.style.display = 'block';
      if (matchMedia('(display-mode: standalone)').matches) {
        guide.textContent = '이미 설치되어 있습니다.';
      } else if (/iPhone|iPad|iPod/.test(ua)) {
        guide.textContent = '하단 공유 버튼(□↑) → "홈 화면에 추가"를 누르세요.';
      } else {
        guide.textContent = '브라우저 메뉴(⋮) → "홈 화면에 추가" 또는 "앱 설치"를 누르세요.';
      }
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
